name: CI

# 触发时机（仅 main / master）：
# 1. pull_request → 向 main/master 提 PR、更新 PR 分支时（合并前检查）
# 2. push        → 直接 push 到 main/master，或 PR 合并完成后 push 到 main/master
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test
