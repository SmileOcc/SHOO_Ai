services:
  postgres:
    # Prefer local tag; if missing, pull via DaoCloud mirror then:
    # docker pull docker.m.daocloud.io/library/postgres:16-alpine
    # docker tag docker.m.daocloud.io/library/postgres:16-alpine postgres:16-alpine
    image: postgres:16-alpine
    container_name: shoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shoo
      POSTGRES_PASSWORD: shoo
      POSTGRES_DB: shoo
    ports:
      - "5432:5432"
    volumes:
      - shoo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoo -d shoo"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: shoo-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shoo
      MINIO_ROOT_PASSWORD: shoo_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - shoo_minio_data:/data

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: shoo-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://shoo:shoo@postgres:5432/shoo?schema=public
      JWT_SECRET: shoo_dev_jwt_secret_change_me
      ADMIN_JWT_SECRET: shoo_admin_jwt_secret_change_me
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:4173
    ports:
      - "8080:8080"

  admin-web:
    build:
      context: ../../apps/admin-web
      dockerfile: Dockerfile
    container_name: shoo-admin-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  shoo_pg_data:
  shoo_minio_data:
