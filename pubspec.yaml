name: shoo
description: SHOO — Shein-style Flutter e-commerce app (Mock backend).
publish_to: 'none'
version: 0.4.0+1

environment:
  sdk: ^3.8.1

dependencies:
  app_links: ^6.4.0
  archive: ^4.0.9
  cached_network_image: ^3.4.1
  connectivity_plus: ^6.1.4
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  encrypt: ^5.0.3
  fast_gbk: ^1.0.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.1
  flutter_local_notifications: ^19.0.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown: ^0.7.7
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^2.4.4
  gal: ^2.3.2
  go_router: ^14.8.1
  image_picker: ^1.1.2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  just_audio: ^0.10.5
  package_info_plus: ^8.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdfx: ^2.9.2
  permission_handler: ^11.4.0
  photo_view: ^0.15.0
  pointycastle: ^3.9.1
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  timezone: ^0.10.1
  url_launcher: ^6.3.1
  video_player: ^2.9.3
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.7.0
  webview_flutter_wkwebview: ^3.22.0

dev_dependencies:
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.8
  json_serializable: ^6.9.5

flutter_launcher_icons:
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
    background_color: "#222222"
    theme_color: "#FF4657"
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#222222"
  adaptive_icon_foreground: assets/brand/app_icon.png

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/mock/
    - assets/brand/
    - assets/music/
    - assets/book/
    - assets/video/
    - assets/activity/
    - assets/webview/
    - study/
